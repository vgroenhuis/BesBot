; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32c5-besbot]
platform = https://github.com/pioarduino/platform-espressif32.git
framework = arduino
board = esp32-c5-devkitc1-n8r4
upload_speed = 921600
monitor_speed = 115200
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
lib_deps = 
	adafruit/Adafruit SSD1306@^2.5.15
	esp32async/ESPAsyncWebServer@^3.8.1
	bblanchon/ArduinoJson@^7.4.2
    vgroenhuis/roaming-wifi-manager
    ; symlink://../roaming-wifi-manager
build_flags =
    -D WIFI_DEBUG_LEVEL=3



[env:esp-c5-espressif]
platform = https://github.com/pioarduino/platform-espressif32.git
framework = arduino
upload_speed = 921600
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = partitions.csv

board = esp32-c5-devkitc1-n8r4 
lib_deps =
    esp32async/ESPAsyncWebServer @ ^3.9.4
    ;vgroenhuis/roaming-wifi-manager @ ^0.4.0
    vgroenhuis/PneumaticStepper

    symlink://../roaming-wifi-manager ; use local version of roaming-wifi-manager
    ;symlink://../PneumaticStepper     ; use local version of PneumaticStepper
build_flags = 
    -D WIFI_DEBUG_LEVEL=3  ; uncomment in case the web interface is unreachable and you need to force a certain minimum debug level
